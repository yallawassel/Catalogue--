<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Pack Catalogue</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}
header{background:#111827;color:#fff;padding:22px 16px}.wrap{max-width:1100px;margin:auto;padding:14px}h1{margin:0;font-size:26px}.sub{opacity:.75;margin-top:5px}
.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.categories{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.cat{border:0;border-radius:20px;padding:9px 13px;background:#e5e7eb;white-space:nowrap}.active{background:#111827;color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #0001}.card img{width:100%;aspect-ratio:1;object-fit:contain}.body{padding:12px}.name{font-weight:800;font-size:17px}.desc{color:#596273;font-size:13px;line-height:1.4;margin-top:5px}.price{font-size:20px;font-weight:900;margin-top:9px}.empty{text-align:center;padding:50px;color:#6b7280}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.lightbox.show{display:flex}
.lightbox-content{max-width:96vw;max-height:94vh;text-align:center}
.lightbox img{max-width:92vw;max-height:82vh;width:auto;height:auto;object-fit:contain;background:#fff;border-radius:12px;box-shadow:0 10px 40px #0008;touch-action:none;cursor:zoom-in;transition:transform .15s ease}
.lightbox.zoomed img{cursor:zoom-out}
.zoom-controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10002}
.zoom-controls button{width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#111;font-size:24px;font-weight:bold;box-shadow:0 3px 15px #0006}
.zoom-level{min-width:72px;padding:12px 10px;text-align:center;border-radius:24px;background:#fff;color:#111;font-weight:bold}
.lightbox-info{color:#fff;margin-top:10px}
.lightbox-name{font-size:20px;font-weight:800}
.lightbox-price{font-size:17px;margin-top:4px}
.lightbox-close{position:fixed;top:12px;right:12px;width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#111;font-size:30px;z-index:10001}
.card img{cursor:zoom-in}
</style></head><body>
<header><div class="wrap"><h1 id="title">White Pack</h1><div class="sub">Product Catalogue</div></div></header>
<main class="wrap"><div class="toolbar"><input id="search" placeholder="🔍 Search products..."></div><div id="cats" class="categories"></div><div id="grid" class="grid"></div></main>

<div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <div class="lightbox-content">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-info">
      <div id="lightboxName" class="lightbox-name"></div>
      <div id="lightboxPrice" class="lightbox-price"></div>
    </div>
  </div>
  <div class="zoom-controls" onclick="event.stopPropagation()">
    <button onclick="zoomImage(-0.25)">−</button>
    <div id="zoomLevel" class="zoom-level">100%</div>
    <button onclick="zoomImage(0.25)">+</button>
    <button onclick="resetZoom()">↺</button>
  </div>
</div>
<script>
let products=[],active='All',zoom=1,dragging=false,startX=0,startY=0,panX=0,panY=0;
fetch('products.json?'+Date.now()).then(r=>r.json()).then(d=>{products=d.products||[];title.textContent=d.businessName||'White Pack';document.title=d.businessName||'Catalogue';render()}).catch(()=>grid.innerHTML='<div class="empty">Catalogue unavailable.</div>');
search.oninput=render;
function render(){let q=search.value.toLowerCase(),cats=['All',...new Set(products.map(x=>x.category).filter(Boolean))];catsEl=cats;catsDiv=document.getElementById('cats');catsDiv.innerHTML=cats.map(c=>`<button class="cat ${c==active?'active':''}" onclick="active=${JSON.stringify(c)};render()">${esc(c)}</button>`).join('');
let a=products.filter(p=>(active==='All'||p.category===active)&&(`${p.name} ${p.description||''}`).toLowerCase().includes(q));grid.innerHTML=a.length?a.map(p=>`<article class="card"><img src="${p.photo}" alt="${esc(p.name)}" onclick="openLightbox(${JSON.stringify(p.photo)},${JSON.stringify(p.name)},${JSON.stringify(p.price)})"><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description)}</div><div class="price">$${String(p.price||'').replace(/^\$/,'')}</div></div></article>`).join(''):'<div class="empty">No products found.</div>'}

function openLightbox(photoSrc,name,price){
  if(!photoSrc)return;
  resetZoom();
  document.getElementById('lightboxImg').src=photoSrc;
  document.getElementById('lightboxImg').alt=name||'Product';
  document.getElementById('lightboxName').textContent=name||'';
  document.getElementById('lightboxPrice').textContent=price?'$'+String(price).replace(/^\$/,''):'';
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  resetZoom();
  document.getElementById('lightboxImg').src='';
  document.body.style.overflow='';
}
function applyZoom(){
  const img=document.getElementById('lightboxImg');
  img.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('zoomLevel').textContent=Math.round(zoom*100)+'%';
  document.getElementById('lightbox').classList.toggle('zoomed',zoom>1);
}
function zoomImage(amount){
  zoom=Math.min(4,Math.max(1,zoom+amount));
  if(zoom===1){panX=0;panY=0;}
  applyZoom();
}
function resetZoom(){
  zoom=1;panX=0;panY=0;
  const img=document.getElementById('lightboxImg');
  if(img) img.style.transform='translate(0,0) scale(1)';
  const level=document.getElementById('zoomLevel');
  if(level) level.textContent='100%';
  const box=document.getElementById('lightbox');
  if(box) box.classList.remove('zoomed');
}
const zoomImg=document.getElementById('lightboxImg');
zoomImg.addEventListener('click',function(e){
  e.stopPropagation();
  zoomImage(zoom===1?1:-0.5);
});
zoomImg.addEventListener('wheel',function(e){
  e.preventDefault();
  zoomImage(e.deltaY<0?0.25:-0.25);
},{passive:false});
zoomImg.addEventListener('pointerdown',function(e){
  if(zoom<=1)return;
  dragging=true;startX=e.clientX-panX;startY=e.clientY-panY;zoomImg.setPointerCapture(e.pointerId);
});
zoomImg.addEventListener('pointermove',function(e){
  if(!dragging)return;
  panX=e.clientX-startX;panY=e.clientY-startY;applyZoom();
});
zoomImg.addEventListener('pointerup',function(){dragging=false;});
zoomImg.addEventListener('pointercancel',function(){dragging=false;});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeLightbox();
  if(e.key==='+')zoomImage(0.25);
  if(e.key==='-')zoomImage(-0.25);
  if(e.key==='0')resetZoom();
});

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
