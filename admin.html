<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Pack — Secure Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}.wrap{max-width:850px;margin:auto;padding:14px}.panel{background:#fff;padding:16px;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{margin:0 0 8px}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}textarea{min-height:80px}
button{padding:12px 15px;border:0;border-radius:10px;font-weight:700;margin-top:8px;font-size:15px}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}.edit{background:#dbeafe;color:#1e40af}
.photo{height:210px;border:2px dashed #cbd5e1;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}.photo img{width:100%;height:100%;object-fit:contain;display:none}.filePicker{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.hint{color:#667085;font-size:14px;line-height:1.5}.item{display:flex;gap:10px;align-items:center;background:#f8fafc;padding:9px;border-radius:12px;margin:8px 0}.item img{width:70px;height:70px;object-fit:contain}.item div{flex:1;min-width:0}.small{font-size:12px;color:#667085}.ok{padding:12px;border-radius:10px;background:#ecfdf3;color:#166534;margin-top:10px}.err{padding:12px;border-radius:10px;background:#fee2e2;color:#991b1b;margin-top:10px}
.searchBox{position:sticky;top:0;z-index:5;background:#fff;padding:10px 0 6px}.searchRow{display:flex;gap:8px;align-items:center}.searchRow input{flex:1}.searchClear{margin-top:0;white-space:nowrap}.searchInfo{font-size:13px;color:#667085;margin-top:6px}.noResults{padding:16px;text-align:center;color:#667085;background:#f8fafc;border-radius:12px}
</style></head><body><div class="wrap">
<div id="login" class="panel"><h1>🔐 White Pack Admin</h1><div class="hint">Authentication is handled by the server. The password is not stored in this HTML file.</div>
<label>Admin Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" onclick="login()">🔓 Login</button><div id="loginMsg"></div></div>
<div id="app" style="display:none">
<div class="panel"><h1>📦 White Pack — Secure Editor</h1><div class="hint">Cost prices are sent only after server authentication and are never returned by the public catalogue API.</div><button class="secondary" onclick="logout()">Logout</button></div>
<div class="panel"><label>Business Name</label><input id="biz" value="White Pack"><label>Product Photo</label><div class="photo" id="photoBox"><img id="preview"><span id="pt">📷 Tap to choose photo</span></div><input id="file" type="file" accept="image/*" class="filePicker">
<label>Product Name</label><input id="name"><label>Description</label><textarea id="desc"></textarea><div class="row"><div><label>Customer Price (USD)</label><input id="price" inputmode="decimal"></div><div><label>🔐 Cost Price (USD)</label><input id="costPrice" inputmode="decimal"></div></div><label>Category</label><input id="cat"><div class="row"><button class="primary" onclick="saveProduct()">💾 Save Product</button><button class="secondary" onclick="clearForm()">Clear</button></div><div id="status"></div></div>
<div class="panel"><h2>Products <span id="count"></span></h2>
<div class="searchBox"><div class="searchRow"><input id="productSearch" type="search" placeholder="🔎 Search product, category, barcode..." autocomplete="off"><button class="secondary searchClear" onclick="clearSearch()">Clear</button></div><div id="searchInfo" class="searchInfo"></div></div>
<div id="list"></div>
<div class="row">
<button class="primary" onclick="downloadPublic()">⬇️ Download public products.json</button>
<button class="secondary" onclick="$('importFile').click()">📥 Import products.json</button>
<button class="danger" onclick="removeDuplicates()">🧹 Remove Duplicates</button>
<input id="importFile" type="file" accept=".json,application/json" hidden>
</div>
<div id="importStatus"></div>
</div>
</div></div>
<script>
const API_URL="https://whitepack-api.chidiacch.workers.dev";let token=sessionStorage.getItem("wpAdminToken")||"",products=[],photo="",editId=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{"Authorization":"Bearer "+token}:{})};const r=await fetch(API_URL+path,opt);const d=await r.json().catch(()=>({}));if(r.status===401&&token){token="";sessionStorage.removeItem("wpAdminToken");location.reload();throw new Error("Session expired. Please log in again.");}if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function login(){try{const d=await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});token=d.token;sessionStorage.setItem("wpAdminToken",token);$("login").style.display="none";$("app").style.display="block";await loadAdmin()}catch(e){$("loginMsg").className="err";$("loginMsg").textContent="Wrong password or server error."}}
async function loadAdmin(){const d=await api("/api/admin/products");products=d.products||[];$("biz").value=d.businessName||"White Pack";render()}
function logout(){token="";sessionStorage.removeItem("wpAdminToken");location.reload()}
$("photoBox").onclick=()=>$("file").click();$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;photo=await compressImage(f,700,.68);$("preview").src=photo;$("preview").style.display="block";$("pt").style.display="none"};
function compressImage(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{let w=i.naturalWidth,h=i.naturalHeight,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);res(c.toDataURL("image/jpeg",q))};i.onerror=rej;i.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}
async function saveProduct(){try{const p={name:$("name").value.trim(),description:$("desc").value.trim(),price:$("price").value.replace(/[^0-9.]/g,""),costPrice:$("costPrice").value.replace(/[^0-9.]/g,""),category:$("cat").value.trim()||"Products",photo};if(!p.name)return alert("Enter a product name.");if(editId)p.id=editId;await api("/api/admin/products",{method:editId?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({businessName:$("biz").value.trim()||"White Pack",product:p})});clearForm();await loadAdmin();show("Saved.")}catch(e){show(e.message,true)}}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editId=id;$("name").value=p.name||"";$("desc").value=p.description||"";$("price").value=p.price||"";$("costPrice").value=p.costPrice||"";$("cat").value=p.category||"";photo=p.photo||"";$("preview").src=photo;$("preview").style.display=photo?"block":"none";$("pt").style.display=photo?"none":"block";scrollTo(0,0)}
async function del(id){if(!confirm("Delete this product?"))return;await api("/api/admin/products/"+encodeURIComponent(id),{method:"DELETE"});await loadAdmin()}
function clearForm(){editId=null;photo="";["name","desc","price","costPrice","cat"].forEach(id=>$(id).value="");$("preview").style.display="none";$("pt").style.display="block";$("file").value=""}
function render(){const q=($("productSearch")?.value||"").trim().toLowerCase();const filtered=products.filter(p=>{if(!q)return true;return [p.name,p.category,p.barcode,p.code,p.id,p.description].some(v=>String(v??"").toLowerCase().includes(q))});$("count").textContent=products.length;$("searchInfo").textContent=q?`Showing ${filtered.length} of ${products.length} products`:`${products.length} products`;$("list").innerHTML=filtered.map(p=>`<div class="item"><img src="${esc(p.photo||"")}"><div><b>${esc(p.name)}</b><br><span class="small">$${esc(p.price||"")} • Cost: $${esc(p.costPrice||"")} • ${esc(p.category||"Products")}</span></div><button class="edit" onclick="editProduct('${esc(p.id)}')">Edit</button><button class="danger" onclick="del('${esc(p.id)}')">Delete</button></div>`).join("")||'<div class="noResults">No matching products found.</div>'}

/* NEW: Import products.json from the first admin into the secure/cloud admin.
   Existing products with the same ID are updated; products without a matching ID are added.
   costPrice is preserved when present, otherwise left empty. */
async function importProductsJSON(file){
  const el=$("importStatus");
  try{
    el.className="ok"; el.textContent="⏳ Reading products.json...";
    const d=JSON.parse(await file.text());
    if(!d || !Array.isArray(d.products)) throw new Error("Invalid products.json: products array not found.");
    if(!d.products.length) throw new Error("The file contains no products.");

    const norm=v=>String(v??"").toLowerCase().trim().replace(/\s+/g," ").replace(/[\u200B-\u200D\uFEFF]/g,"");
    const fullKey=(p)=>[
      norm(p.name),
      norm(p.category||"Products"),
      norm(p.description),
      norm(p.price)
    ].join("||");

    const byId=new Map();
    const byBarcode=new Map();
    const byCode=new Map();
    const byFull=new Map();

    products.forEach(p=>{
      if(p.id) byId.set(String(p.id),p);
      if(p.barcode) byBarcode.set(norm(p.barcode),p);
      if(p.code) byCode.set(norm(p.code),p);
      byFull.set(fullKey(p),p);
    });

    let added=0,updated=0,failed=0;

    for(let i=0;i<d.products.length;i++){
      const old=d.products[i]||{};
      const name=String(old.name??"").trim();
      const category=String(old.category??"Products").trim()||"Products";
      if(!name){failed++;continue;}

      const incomingForMatch={
        ...old,
        name,
        category,
        description:String(old.description??"").trim(),
        price:String(old.price??"").replace(/[^0-9.]/g,"")
      };

      const existing=(old.id&&byId.get(String(old.id))) ||
        (old.barcode&&byBarcode.get(norm(old.barcode))) ||
        (old.code&&byCode.get(norm(old.code))) ||
        byFull.get(fullKey(incomingForMatch));

      const p={...old,
        name,
        description:String(old.description??"").trim(),
        price:String(old.price??"").replace(/[^0-9.]/g,""),
        costPrice:String(old.costPrice??"").replace(/[^0-9.]/g,""),
        category,
        photo:String(old.photo??"")
      };

      if(old.barcode!==undefined)p.barcode=String(old.barcode).trim();
      if(old.code!==undefined)p.code=String(old.code).trim();
      if(existing)p.id=existing.id;

      try{
        const result=await api("/api/admin/products",{
          method:existing?"PUT":"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            businessName:String(d.businessName||$("biz").value||"White Pack").trim()||"White Pack",
            product:p
          })
        });

        const saved=result.product||p;
        if(saved.id)byId.set(String(saved.id),saved);
        if(saved.barcode)byBarcode.set(norm(saved.barcode),saved);
        if(saved.code)byCode.set(norm(saved.code),saved);
        byFull.set(fullKey(saved),saved);

        if(existing)updated++;else added++;
      }catch(e){failed++;}

      el.textContent=`⏳ Importing ${i+1} of ${d.products.length}... Added: ${added}, Updated: ${updated}, Failed: ${failed}`;
    }

    await loadAdmin();
    el.className=failed?"err":"ok";
    el.textContent=`✅ Import finished. Added: ${added} • Updated: ${updated} • Failed: ${failed}`;
  }catch(e){
    el.className="err";
    el.textContent="❌ Import failed: "+(e.message||"Invalid file.");
  }
}
$("importFile").addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;await importProductsJSON(f);e.target.value=""});


/* DUPLICATE CLEANUP
   Removes only duplicate records that have the same strong identity:
   - same ID, or
   - same barcode, or
   - same code, or
   - same name + category + description + price

   This deliberately does NOT treat name + category alone as a duplicate,
   so legitimate size/quantity/price variants are preserved.
*/
async function removeDuplicates(){
  if(!products.length){
    alert("No products loaded.");
    return;
  }

  const ok=confirm(
    "This will scan the Cloudflare catalogue and permanently delete duplicate product records.\n\n" +
    "Different variants with different descriptions or prices will be kept.\n\nContinue?"
  );
  if(!ok)return;

  const statusEl=$("importStatus");
  statusEl.className="ok";
  statusEl.textContent="⏳ Scanning products for exact duplicates...";

  const norm=v=>String(v??"").toLowerCase().trim()
    .replace(/\s+/g," ")
    .replace(/[\u200B-\u200D\uFEFF]/g,"");

  const exactKey=p=>[
    norm(p.name),
    norm(p.category||"Products"),
    norm(p.description),
    norm(p.price)
  ].join("||");

  const seenId=new Set();
  const seenBarcode=new Set();
  const seenCode=new Set();
  const seenExact=new Set();
  const duplicateIds=new Set();

  for(const p of products){
    let duplicate=false;

    if(p.id){
      const k=String(p.id);
      if(seenId.has(k)) duplicate=true;
      else seenId.add(k);
    }

    if(!duplicate && p.barcode){
      const k=norm(p.barcode);
      if(k && seenBarcode.has(k)) duplicate=true;
      else if(k) seenBarcode.add(k);
    }

    if(!duplicate && p.code){
      const k=norm(p.code);
      if(k && seenCode.has(k)) duplicate=true;
      else if(k) seenCode.add(k);
    }

    if(!duplicate){
      const k=exactKey(p);
      if(seenExact.has(k)) duplicate=true;
      else seenExact.add(k);
    }

    if(duplicate && p.id) duplicateIds.add(String(p.id));
  }

  if(!duplicateIds.size){
    statusEl.textContent="✅ No exact duplicate products found in the Cloudflare catalogue.";
    return;
  }

  statusEl.textContent=`⏳ Found ${duplicateIds.size} exact duplicate record(s). Deleting...`;

  let deleted=0, failed=0;

  for(const id of duplicateIds){
    try{
      await api("/api/admin/products/"+encodeURIComponent(id),{method:"DELETE"});
      deleted++;
      statusEl.textContent=`⏳ Removing duplicates... ${deleted}/${duplicateIds.size}`;
    }catch(e){
      failed++;
    }
  }

  await loadAdmin();

  statusEl.className=failed?"err":"ok";
  statusEl.textContent=failed
    ? `⚠️ Cleanup finished. Deleted: ${deleted} • Failed: ${failed}`
    : `✅ Duplicate cleanup finished. Deleted: ${deleted} • Products remaining: ${products.length}`;
}

async function downloadPublic(){const d=await api("/api/admin/public-export");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="products.json";a.click()}
function show(t,e=false){$("status").className=e?"err":"ok";$("status").textContent=t}
function clearSearch(){$("productSearch").value="";render();$("productSearch").focus()}
$("productSearch").addEventListener("input",render);
if(token){$("login").style.display="none";$("app").style.display="block";loadAdmin().catch(()=>logout())}
</script></body></html>
