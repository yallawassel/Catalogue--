<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>White Pack Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6f8;color:#111827}
header{background:#111827;color:white;padding:18px}.wrap{max-width:900px;margin:auto;padding:14px}
h1{margin:0;font-size:23px}.sub{opacity:.75;margin-top:4px}
.box{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 12px #0001}
label{font-weight:700;font-size:14px;display:block;margin:12px 0 6px}
input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:white}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}.muted{background:#e5e7eb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin-top:10px;display:flex;gap:12px;align-items:center}
.item img{width:70px;height:70px;object-fit:contain;background:#f8fafc;border-radius:9px}
.item .grow{flex:1}.small{font-size:12px;color:#6b7280}
#file{display:none}.filebtn{display:block;text-align:center;background:#e5e7eb;padding:13px;border-radius:11px;font-weight:700}
.status{padding:12px;border-radius:11px;background:#ecfdf5;color:#166534;display:none;margin-top:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}.item{align-items:flex-start}.item img{width:60px;height:60px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>White Pack — Admin</h1><div class="sub">Phone-friendly catalogue editor</div></div></header>
<main class="wrap">
<div class="box">
<h2>Add / Edit Product</h2>
<label>Product name</label><input id="name" placeholder="Example: Kraft Bag 40">
<label>Category</label><input id="category" list="categoryList" placeholder="Example: Paper Bags"><datalist id="categoryList"></datalist>
<div class="row"><div><label>Price</label><input id="price" placeholder="2.50" inputmode="decimal"></div><div><label>Image</label><label for="file" class="filebtn">📷 Choose photo</label><input id="file" type="file" accept="image/*"></div></div>
<label>Description</label><textarea id="description" placeholder="Size, quantity, specifications..."></textarea>
<div id="preview"></div>
<div class="actions"><button class="primary" id="add">Add Product</button><button class="muted" id="clear">Clear</button></div>
<div id="status" class="status"></div>
</div>

<div class="box">
<h2>Products</h2>
<div class="actions"><button class="primary" id="download">⬇️ Download products.json</button><button class="muted" id="importBtn">📥 Import JSON</button><button class="danger" id="clearAll">Delete All</button></div>
<input id="importFile" type="file" accept=".json,application/json" style="display:none">
<div id="list"></div>
</div>
</main>
<script>
let data={businessName:"White Pack",products:[]},imageData="";
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem("whitepack_admin",JSON.stringify(data));
function status(t){$("status").textContent=t;$("status").style.display="block";setTimeout(()=>$("status").style.display="none",2500)}
function cats(){return [...new Set(data.products.map(p=>p.category).filter(Boolean))].sort()}
function render(){
 $("categoryList").innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join("");
 $("list").innerHTML=data.products.length?data.products.map((p,i)=>`<div class="item"><img src="${p.photo||""}" alt=""><div class="grow"><b>${esc(p.name)}</b><div class="small">${esc(p.category)} ${p.price!==""&&p.price!=null?"• $"+esc(p.price):""}</div></div><button class="danger" onclick="del(${i})">Delete</button></div>`).join(""):'<div class="small">No products yet.</div>';
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;$("preview").innerHTML='<img src="'+imageData+'" style="max-width:140px;max-height:140px;margin-top:10px;border-radius:10px">'};r.readAsDataURL(f)}
$("add").onclick=()=>{const n=$("name").value.trim(),c=$("category").value.trim();if(!n||!c){alert("Enter product name and category.");return}data.products.push({name:n,category:c,price:$("price").value.trim(),description:$("description").value.trim(),photo:imageData});save();render();clearForm();status("Product added on this phone.")}
function clearForm(){["name","category","price","description"].forEach(id=>$(id).value="");imageData="";$("file").value="";$("preview").innerHTML=""}
$("clear").onclick=clearForm;
window.del=i=>{if(confirm("Delete this product?")){data.products.splice(i,1);save();render()}}
$("download").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="products.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);data={businessName:x.businessName||"White Pack",products:Array.isArray(x)?x:(x.products||[])};save();render();status("JSON imported.")}catch{alert("Invalid JSON file.")}};r.readAsText(f)}
$("clearAll").onclick=()=>{if(confirm("Delete ALL products from this admin?")){data.products=[];save();render()}}
try{const x=JSON.parse(localStorage.getItem("whitepack_admin")||"null");if(x&&Array.isArray(x.products))data=x}catch{}
render();
</script>
</body></html>
